name: Build and Update Silo AIO Image

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Convert Owner Name to Lowercase
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Check for Upstream Base Image Updates
        if: github.event_name == 'schedule'
        id: check
        uses: lucacome/docker-image-update-checker@v3
        with:
          base-image: ghcr.io/silo-server/silo-server:latest
          image: ghcr.io/${{ env.REPO_OWNER }}/silo-aio:latest

      - name: Determine Build Trigger Status
        id: build_decision
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.check.outputs.needs-updating }}" == "true" ]; then
            echo "SHOULD_BUILD=true" >> ${GITHUB_ENV}
            echo "Build condition met: proceeding with container build."
          else
            echo "SHOULD_BUILD=false" >> ${GITHUB_ENV}
            echo "No upstream updates detected. Skipping build step."
          fi

      - name: Set up Docker Buildx
        if: env.SHOULD_BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.SHOULD_BUILD == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: env.SHOULD_BUILD == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/silo-aio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
